services:
  postgres-cert:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: uniportal_cert
      POSTGRES_PASSWORD: uniportal_cert_only
      POSTGRES_DB: uniportal_cert
    ports:
      - "55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniportal_cert -d uniportal_cert"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [uniportal_cert]

  redis-cert:
    image: redis:7-alpine
    ports:
      - "56380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [uniportal_cert]

  minio-cert:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: uniportal_cert
      MINIO_ROOT_PASSWORD: uniportal_cert_storage_only
    command: server /data --console-address ":9001"
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio_cert_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [uniportal_cert]

  mailpit-cert:
    image: axllent/mailpit:latest
    ports:
      - "51025:1025"
      - "58025:8025"
    networks: [uniportal_cert]

networks:
  uniportal_cert:
    driver: bridge

volumes:
  minio_cert_data:
