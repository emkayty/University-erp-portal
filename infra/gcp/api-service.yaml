# Replace every ALL_CAPS placeholder before applying:
#   gcloud run services replace infra/gcp/api-service.yaml --region REGION
# Create Secret Manager secrets for every secretKeyRef name. Use Cloud SQL and
# Memorystore in the same region; do not place PostgreSQL or Redis on the public internet.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: uniportal-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:CLOUD_SQL_INSTANCE
        run.googleapis.com/vpc-access-connector: projects/PROJECT_ID/locations/REGION/connectors/VPC_CONNECTOR
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      serviceAccountName: uniportal-runtime@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/uniportal-api:TAG
          ports:
            - name: http1
              containerPort: 3001
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: NODE_ENV
              value: production
            - name: PROCESS_ROLE
              value: api
            - name: API_PORT
              value: "3001"
            - name: RUN_DB_SCHEMA
              value: "false"
            - name: TRUST_PROXY
              value: "true"
            - name: TRUST_PROXY_HOPS
              value: "1"
            - name: FRONTEND_ORIGIN
              value: https://YOUR_VERCEL_DOMAIN
            - name: DATABASE_URL
              valueFrom:
                { secretKeyRef: { name: uniportal-database-url, key: latest } }
            - name: DATABASE_DIRECT_URL
              valueFrom:
                {
                  secretKeyRef:
                    { name: uniportal-database-direct-url, key: latest },
                }
            - name: MIGRATE_DATABASE_URL
              valueFrom:
                {
                  secretKeyRef:
                    { name: uniportal-migrate-database-url, key: latest },
                }
            - name: REDIS_URL
              valueFrom:
                { secretKeyRef: { name: uniportal-redis-url, key: latest } }
            - name: JWT_PRIVATE_KEY_B64
              valueFrom:
                {
                  secretKeyRef:
                    { name: uniportal-jwt-private-key, key: latest },
                }
            - name: JWT_PUBLIC_KEY_B64
              valueFrom:
                {
                  secretKeyRef: { name: uniportal-jwt-public-key, key: latest },
                }
            - name: ENCRYPTION_KEY_HEX
              valueFrom:
                {
                  secretKeyRef: { name: uniportal-encryption-key, key: latest },
                }
            - name: SMTP_FROM
              valueFrom:
                { secretKeyRef: { name: uniportal-smtp-from, key: latest } }
            - name: SMTP_HOST
              valueFrom:
                { secretKeyRef: { name: uniportal-smtp-host, key: latest } }
            - name: SMTP_USER
              valueFrom:
                { secretKeyRef: { name: uniportal-smtp-user, key: latest } }
            - name: SMTP_PASS
              valueFrom:
                { secretKeyRef: { name: uniportal-smtp-password, key: latest } }
