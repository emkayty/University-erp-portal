# Build the image with NEXT_PUBLIC_API_URL set to the final API HTTPS URL:
# docker build --build-arg NEXT_PUBLIC_API_URL=https://api.example.edu.ng -f apps/web/Dockerfile -t IMAGE .
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: uniportal-web
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/uniportal-web:TAG
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
