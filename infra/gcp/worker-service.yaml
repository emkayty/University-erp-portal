# Replace every ALL_CAPS placeholder before applying. This is a Cloud Run
# service (not a short-lived Job) because BullMQ consumers must remain alive.
# Keep maxScale=1 unless the application establishes distributed scheduler locks.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: uniportal-worker
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:CLOUD_SQL_INSTANCE
        run.googleapis.com/vpc-access-connector: projects/PROJECT_ID/locations/REGION/connectors/VPC_CONNECTOR
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 1
      timeoutSeconds: 3600
      serviceAccountName: uniportal-runtime@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/uniportal-api:TAG
          command: ["/app/scripts/start-worker.sh"]
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: NODE_ENV
              value: production
            - name: PROCESS_ROLE
              value: worker
            - name: WORKER_HEALTH_PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                { secretKeyRef: { name: uniportal-database-url, key: latest } }
            - name: DATABASE_DIRECT_URL
              valueFrom:
                {
                  secretKeyRef:
                    { name: uniportal-database-direct-url, key: latest },
                }
            - name: REDIS_URL
              valueFrom:
                { secretKeyRef: { name: uniportal-redis-url, key: latest } }
            - name: JWT_PRIVATE_KEY_B64
              valueFrom:
                {
                  secretKeyRef:
                    { name: uniportal-jwt-private-key, key: latest },
                }
            - name: JWT_PUBLIC_KEY_B64
              valueFrom:
                {
                  secretKeyRef: { name: uniportal-jwt-public-key, key: latest },
                }
            - name: ENCRYPTION_KEY_HEX
              valueFrom:
                {
                  secretKeyRef: { name: uniportal-encryption-key, key: latest },
                }
            - name: SMTP_FROM
              valueFrom:
                { secretKeyRef: { name: uniportal-smtp-from, key: latest } }
            - name: SMTP_HOST
              valueFrom:
                { secretKeyRef: { name: uniportal-smtp-host, key: latest } }
            - name: SMTP_USER
              valueFrom:
                { secretKeyRef: { name: uniportal-smtp-user, key: latest } }
            - name: SMTP_PASS
              valueFrom:
                { secretKeyRef: { name: uniportal-smtp-password, key: latest } }
