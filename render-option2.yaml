services:
  - type: web
    name: university-erp-portal-test
    runtime: docker
    plan: free
    region: frankfurt
    branch: render-free-test
    autoDeployTrigger: commit
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: /app/scripts/start-api.sh
    healthCheckPath: /api/health/live
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PROCESS_ROLE
        value: api
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: MIGRATE_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://university-erp-portal-frontent.onrender.com
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: JWT_PUBLIC_KEY_B64
        sync: false
      - key: ENCRYPTION_KEY_HEX
        sync: false
      - key: ADMISSIONS_TRACKING_SECRET
        sync: false
      - key: AWS_REGION
        value: eu-central-1
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_UPLOADS_BUCKET
        sync: false
      - key: S3_REPORTS_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"

  - type: web
    name: university-erp-portal-frontent
    runtime: docker
    plan: free
    region: frankfurt
    branch: render-free-test
    autoDeployTrigger: commit
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://university-erp-portal-test.onrender.com
