services:
  - type: web
    name: uniportal-api-worker-test
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: /app/scripts/start-api-worker.sh
    healthCheckPath: /api/health/live
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: staging
      - key: RENDER_MANAGED_DB
        value: "true"
      - key: RUN_DB_SCHEMA
        value: "false"
      - key: DATABASE_ADMIN_URL
        fromDatabase:
          name: uniportal-db-test
          property: connectionString
      - key: MIGRATE_DATABASE_URL
        fromDatabase:
          name: uniportal-db-test
          property: connectionString
      - key: DATABASE_NAME
        fromDatabase:
          name: uniportal-db-test
          property: database
      - key: DATABASE_AUTO_BOOTSTRAP_ROLES
        value: "true"
      - key: DATABASE_APP_PASSWORD
        sync: false
      - key: DATABASE_SYSTEM_PASSWORD
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: uniportal-redis-test
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: JWT_PUBLIC_KEY_B64
        sync: false
      - key: ENCRYPTION_KEY_HEX
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"

  - type: keyvalue
    name: uniportal-redis-test
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: uniportal-db-test
    region: frankfurt
    plan: free
    databaseName: uniportal